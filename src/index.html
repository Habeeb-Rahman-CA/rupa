<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>rūpa</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="rūpa">
  <meta name="application-name" content="rūpa">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      margin: 0;
    }

    /* --- Boot splash ------------------------------------------------------
       Rendered as static HTML so it paints on the first frame, before any
       JavaScript. Angular removes it via `AppComponent.hideSplash()` after
       the shell mounts.
    ---------------------------------------------------------------------- */
    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(120% 100% at 0% 0%, #2a2d35 0%, #14161b 55%, #0b0d10 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.35s ease;
      will-change: opacity;
    }
    #app-splash.splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #app-splash img {
      width: 160px;
      max-width: 55vw;
      height: auto;
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      animation: splash-in .55s cubic-bezier(.2,.7,.2,1) 0s forwards;
    }
    #app-splash .splash-tagline {
      margin-top: 16px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.55);
      opacity: 0;
      animation: splash-in .55s cubic-bezier(.2,.7,.2,1) .12s forwards;
    }
    #app-splash .splash-dots {
      position: absolute;
      bottom: calc(48px + env(safe-area-inset-bottom));
      display: flex;
      gap: 6px;
    }
    #app-splash .splash-dots span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.6);
      animation: splash-dot 1s ease-in-out infinite;
    }
    #app-splash .splash-dots span:nth-child(2) { animation-delay: .15s; }
    #app-splash .splash-dots span:nth-child(3) { animation-delay: .3s; }

    @keyframes splash-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes splash-dot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40%           { opacity: 1;    transform: scale(1);    }
    }

    /* Respect reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      #app-splash img,
      #app-splash .splash-tagline { animation: none; opacity: 1; transform: none; }
      #app-splash .splash-dots span { animation: none; opacity: 0.7; }
    }
  </style>
</head>
<body>
  <div id="app-splash" role="status" aria-label="Loading rūpa">
    <img src="rupa-logo-light.png" alt="rūpa" />
    <div class="splash-tagline">your money, made simple</div>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
